name: 同步 Gitee → GitHub

# 说明：
#   Gitee 仓库  https://gitee.com/powerclub/MiaoA  为公开仓库，
#   因此本工作流无需任何令牌即可拉取；推送使用 Actions 自带的 GITHUB_TOKEN。
#   触发方式：每小时的第 23 分钟自动执行一次，也可在 Actions 页面手动 Run workflow。

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 GitHub 仓库（含全部历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 Gitee 镜像拉取并推送
        env:
          GITEE_REPO: https://gitee.com/powerclub/MiaoA.git
        run: |
          set -e
          git config user.name  "gitee-mirror[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub 托管机房经常连不上 Gitee，失败重试 3 次仍不通则跳过（不算失败）
          ok=0
          for i in 1 2 3; do
            if git fetch --prune --force "$GITEE_REPO" \
                 '+refs/heads/*:refs/heads/*' \
                 '+refs/tags/*:refs/tags/*'; then
              ok=1; break
            fi
            echo "第 $i 次拉取 Gitee 失败，30 秒后重试"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::GitHub Actions 所在网络无法访问 Gitee（机房 IP 常被拦截），本次跳过。日常同步请以本地脚本 / git push 为准。"
            exit 0
          fi

          # 原样推送到 GitHub（含删除同步），历史保持一致
          git push --force --prune origin \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
          echo "同步完成，当前 HEAD:"
          git log --oneline -1
